<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cortes de tráfico — Papa León XIV en Madrid</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f3; color: #1a1a1a; }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    header p { font-size: 11px; color: #999; margin-top: 2px; }

    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 9px 20px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-btn {
      font-size: 12px;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid #ddd;
      background: #fff;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn:hover { background: #f0f0f0; }
    .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; font-weight: 500; }
    .sep { width: 1px; height: 18px; background: #e5e5e5; margin: 0 3px; }

    .aviso {
      background: #FEF3E2;
      border-bottom: 1px solid #f5d9a0;
      padding: 7px 20px;
      font-size: 12px;
      color: #633806;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .contador {
      font-size: 11px;
      color: #999;
      padding: 5px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }

    #map { width: 100%; height: calc(100vh - 160px); }

    .legend {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      line-height: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .legend-item { display: flex; align-items: center; gap: 8px; color: #333; }
    .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); border: 1px solid #e5e5e5; }
    .leaflet-popup-content { min-width: 230px; margin: 13px 15px; }
    .popup-fecha { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px; }
    .popup-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #1a1a1a; line-height: 1.3; }
    .popup-meta { font-size: 12px; color: #555; margin-bottom: 3px; line-height: 1.5; }
    .popup-desc { font-size: 12px; color: #333; margin-top: 6px; line-height: 1.5; border-top: 1px solid #f0f0f0; padding-top: 6px; }
    .popup-badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 10px; margin-top: 7px; font-weight: 500; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🚦 Cortes de tráfico — Papa León XIV en Madrid</h1>
    <p>Fuente: Ayuntamiento de Madrid · EMT · Metro · Vatican.va · 3–9 junio 2026</p>
  </div>
</header>

<div class="aviso">
  ⚠️ <strong>Dom 7 jun:</strong> mayor impacto en movilidad. Metro reforzado al 125%. EMT gratuita los días 6 y 7 jun.
</div>

<div class="toolbar">
  <button class="filter-btn active" data-filtro="todos" data-grupo="dia">Todos</button>
  <button class="filter-btn" data-filtro="prev" data-grupo="dia">3–5 jun · Preparativos</button>
  <button class="filter-btn" data-filtro="sab" data-grupo="dia">Sáb 6 jun</button>
  <button class="filter-btn" data-filtro="dom" data-grupo="dia">Dom 7 jun</button>
  <button class="filter-btn" data-filtro="lun" data-grupo="dia">Lun 8 jun</button>
  <button class="filter-btn" data-filtro="mar" data-grupo="dia">Mar 9 jun</button>
  <div class="sep"></div>
  <button class="filter-btn active" data-filtro="todos" data-grupo="tipo">Todos los tipos</button>
  <button class="filter-btn" data-filtro="total" data-grupo="tipo">🔴 Cierre total</button>
  <button class="filter-btn" data-filtro="parcial" data-grupo="tipo">🟠 Corte parcial</button>
  <button class="filter-btn" data-filtro="parking" data-grupo="tipo">🔵 Aparcamiento</button>
</div>

<div class="contador" id="contador"></div>
<div id="map"></div>

<script>
const alertas = [
  // ── PREPARATIVOS 3–5 jun ──────────────────────────────
  {
    dia: "prev", fecha: "3 jun (noche)",
    tipo: "total",
    nombre: "Plaza de Lima y Castellana — Cierre total",
    detalle: "Cierre total desde las 24:00 h del día 3. Zona de influencia en todo el Paseo de la Castellana.",
    zona: "Plaza de Lima, Paseo de la Castellana",
    lat: 40.4524, lng: -3.6916
  },
  {
    dia: "prev", fecha: "4 jun (noche)",
    tipo: "total",
    nombre: "Plaza de Cibeles y entorno — Cierre total",
    detalle: "Cierre total desde las 24:00 h del día 4. Afecta a Recoletos, Alcalá hasta Independencia y Prado sentido norte.",
    zona: "Plaza de Cibeles, Recoletos, Alcalá",
    lat: 40.4195, lng: -3.6922
  },
  {
    dia: "prev", fecha: "5–7 jun",
    tipo: "parking",
    nombre: "Reservas SEA inhabilitadas — todo el municipio",
    detalle: "Todas las reservas SEA del municipio inhabilitadas. Residentes AER con movilidad ampliada a cualquier barrio del AER.",
    zona: "Todo el municipio de Madrid",
    lat: 40.4168, lng: -3.7038
  },
  {
    dia: "prev", fecha: "5–6 jun",
    tipo: "parking",
    nombre: "Zonas ORA afectadas",
    detalle: "Distritos con ORA afectada: Centro (Justicia, Cortes), Retiro (Jerónimos), Salamanca (Recoletos, Castellana), Chamartín (El Viso, Hispanoamérica, Nueva España), Tetuán (Cuatro Caminos, Castillejos), Chamberí (Ríos Rosas, Almagro).",
    zona: "Centro, Retiro, Salamanca, Chamartín, Tetuán, Chamberí",
    lat: 40.4260, lng: -3.6800
  },

  // ── SÁBADO 6 JUN ─────────────────────────────────────
  {
    dia: "sab", fecha: "Sáb 6 jun — todo el día",
    tipo: "total",
    nombre: "Eje Recoletos–Castellana (Cibeles a Lima)",
    detalle: "Eje central completamente cerrado. Acceso al túnel de Plaza de Castilla afectado desde las 14:30 h. ~800.000 asistentes previstos en la vigilia.",
    zona: "Paseo de Recoletos, Paseo de la Castellana",
    lat: 40.4360, lng: -3.6920
  },
  {
    dia: "sab", fecha: "Sáb 6 jun — mañana",
    tipo: "parcial",
    nombre: "Entorno Palacio Real — perímetro de seguridad",
    detalle: "Perímetro de seguridad por llegada papal (10:30 h) y actos institucionales (11:30–13:00 h). Calle Bailén y accesos afectados.",
    zona: "Palacio Real, Calle de Bailén",
    lat: 40.4180, lng: -3.7144
  },
  {
    dia: "sab", fecha: "Sáb 6 jun — tarde",
    tipo: "parcial",
    nombre: "Entorno CEDIA 24 Horas",
    detalle: "Restricciones perimetrales por visita social papal a las 18:00 h.",
    zona: "C/ Barquillo, 3 — Madrid Centro",
    lat: 40.4204, lng: -3.6957
  },
  {
    dia: "sab", fecha: "Sáb 6 jun — noche",
    tipo: "total",
    nombre: "Plaza de Lima — Vigilia de oración",
    detalle: "Vigilia con jóvenes (20:30 h). ~800.000 asistentes. Castellana cortada desde horas antes. Usar metro: Santiago Bernabéu o Lima.",
    zona: "Plaza de Lima, accesos Castellana",
    lat: 40.4526, lng: -3.6912
  },

  // ── DOMINGO 7 JUN ────────────────────────────────────
  {
    dia: "dom", fecha: "Dom 7 jun — todo el día",
    tipo: "total",
    nombre: "Plaza de Cibeles — Cierre total jornada completa",
    detalle: "Mayor impacto en movilidad de los últimos años según fuentes municipales. ~1.000.000 asistentes a la misa (10:00 h).",
    zona: "Plaza de Cibeles y eje central completo",
    lat: 40.4195, lng: -3.6920
  },
  {
    dia: "dom", fecha: "Dom 7 jun — mañana",
    tipo: "total",
    nombre: "Paseo del Prado, Recoletos y Alcalá",
    detalle: "Cortes totales en vías de acceso a Cibeles. Procesión del Corpus Christi integrada en el recorrido de la misa.",
    zona: "Paseo del Prado, Recoletos, Alcalá",
    lat: 40.4138, lng: -3.6920
  },
  {
    dia: "dom", fecha: "Dom 7 jun — tarde",
    tipo: "parcial",
    nombre: "Entorno Movistar Arena",
    detalle: "Perímetro de seguridad por evento 'Tejer redes con la Cultura, el Arte, la Economía y el Deporte' (18:00 h).",
    zona: "Av. de Felipe II — Movistar Arena",
    lat: 40.4357, lng: -3.6613
  },
  {
    dia: "dom", fecha: "Dom 7 jun — noche",
    tipo: "parcial",
    nombre: "Residencia del Cardenal Arzobispo",
    detalle: "Restricciones puntuales por cena oficial del Papa (19:30 h).",
    zona: "Residencia Cardenal Arzobispo de Madrid",
    lat: 40.4280, lng: -3.7050
  },

  // ── LUNES 8 JUN ──────────────────────────────────────
  {
    dia: "lun", fecha: "Lun 8 jun — mañana",
    tipo: "parcial",
    nombre: "Congreso de los Diputados",
    detalle: "Perímetro de seguridad para visita al Parlamento (10:30 h). Carrera de San Jerónimo y adyacentes afectadas.",
    zona: "Carrera de San Jerónimo, s/n",
    lat: 40.4155, lng: -3.6955
  },
  {
    dia: "lun", fecha: "Lun 8 jun — mañana",
    tipo: "parcial",
    nombre: "Conferencia Episcopal Española",
    detalle: "Restricciones por encuentro con los obispos (11:30 h). Calle Añastro y accesos limitados.",
    zona: "C/ Añastro, 1 — Ciudad Lineal",
    lat: 40.4634, lng: -3.6695
  },
  {
    dia: "lun", fecha: "Lun 8 jun — tarde",
    tipo: "parcial",
    nombre: "Catedral de la Almudena",
    detalle: "Cierre perimetral para oración y homenaje a la Virgen de la Almudena (18:00 h). Calle Bailén y entorno afectados.",
    zona: "Catedral de la Almudena, C/ de Bailén",
    lat: 40.4153, lng: -3.7143
  },
  {
    dia: "lun", fecha: "Lun 8 jun — tarde-noche",
    tipo: "parcial",
    nombre: "Estadio Santiago Bernabéu",
    detalle: "Cortes y restricciones por encuentro con la comunidad diocesana (19:00 h). Paseo de la Castellana norte y accesos al estadio cortados.",
    zona: "Av. de Concha Espina, 1 — Bernabéu",
    lat: 40.4531, lng: -3.6883
  },

  // ── MARTES 9 JUN ─────────────────────────────────────
  {
    dia: "mar", fecha: "Mar 9 jun — mañana",
    tipo: "parcial",
    nombre: "Levantamiento progresivo de cortes",
    detalle: "Comitiva de salida desde residencia a Barajas puede generar restricciones puntuales. Normalización del tráfico desde ~12:00 h.",
    zona: "Accesos Aeropuerto Barajas",
    lat: 40.4614, lng: -3.5763
  }
];

const config = {
  total:   { pin: "#E24B4A", badgeBg: "#FCEBEB", badgeColor: "#A32D2D", label: "Cierre total" },
  parcial: { pin: "#BA7517", badgeBg: "#FEF3E2", badgeColor: "#633806", label: "Corte parcial" },
  parking: { pin: "#378ADD", badgeBg: "#E6F1FB", badgeColor: "#0C447C", label: "Aparcamiento" }
};

let filtroDia = "todos";
let filtroTipo = "todos";

function makeIcon(tipo) {
  const color = config[tipo].pin;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40">
    <path d="M15 0C6.716 0 0 6.716 0 15c0 10 15 25 15 25S30 25 30 15C30 6.716 23.284 0 15 0z" fill="${color}"/>
    <circle cx="15" cy="15" r="7" fill="white"/>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [30, 40], iconAnchor: [15, 40], popupAnchor: [0, -42] });
}

const map = L.map('map').setView([40.430, -3.693], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>', maxZoom: 18
}).addTo(map);

let markers = [];

function renderMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  const filtrados = alertas.filter(a =>
    (filtroDia === "todos" || a.dia === filtroDia) &&
    (filtroTipo === "todos" || a.tipo === filtroTipo)
  );
  const n = filtrados.length;
  document.getElementById('contador').textContent = `Mostrando ${n} alerta${n !== 1 ? 's' : ''}`;
  filtrados.forEach(a => {
    const c = config[a.tipo];
    const popup = `<div>
      <div class="popup-fecha">${a.fecha}</div>
      <div class="popup-title">${a.nombre}</div>
      <div class="popup-meta">📍 ${a.zona}</div>
      <div class="popup-desc">${a.detalle}</div>
      <span class="popup-badge" style="background:${c.badgeBg};color:${c.badgeColor}">${c.label}</span>
    </div>`;
    const m = L.marker([a.lat, a.lng], { icon: makeIcon(a.tipo) }).addTo(map).bindPopup(popup);
    markers.push(m);
  });
}

renderMarkers();

document.querySelectorAll('.filter-btn[data-grupo="dia"]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-grupo="dia"]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtroDia = btn.dataset.filtro;
    renderMarkers();
  });
});
document.querySelectorAll('.filter-btn[data-grupo="tipo"]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-grupo="tipo"]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtroTipo = btn.dataset.filtro;
    renderMarkers();
  });
});

const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = `
    <div class="legend-item"><span class="dot" style="background:#E24B4A"></span> Cierre total</div>
    <div class="legend-item"><span class="dot" style="background:#BA7517"></span> Corte parcial</div>
    <div class="legend-item"><span class="dot" style="background:#378ADD"></span> Aparcamiento</div>
  `;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
